# Netlify configuration for Cupdom CRM
# Security headers applied to every response. These are the REAL enforcement
# (the <meta> CSP in index.html.html is only a fallback for drag-and-drop deploys).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # NOTE: the app ships as one big inline <script>, so 'unsafe-inline' is required
    # for script-src. To tighten this to a strict CSP, move the inline script to an
    # external app.js file and change script-src to: 'self' https://cdn.jsdelivr.net
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
