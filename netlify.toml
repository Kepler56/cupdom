# Netlify configuration for Cupdom CRM (Next.js app; Netlify auto-detects the Next build).
# Security headers applied to every response — the REAL CSP enforcement.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # NOTE: Next.js injects inline hydration scripts, so 'unsafe-inline' is required for
    # script-src (a strict CSP would need per-request nonces from the framework). jsdelivr
    # is retained only for any CDN-loaded asset; the QR lib is now bundled via npm.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
