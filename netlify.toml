# Netlify configuration for Cupdom CRM (Next.js app).

# Build the Next.js app (pnpm is auto-detected from pnpm-lock.yaml). The Next runtime plugin
# wires up routing + serverless rendering and publishes the `.next` output.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

  # QR_FALLBACK_URL is marked "contains secret values" in the Netlify UI, but its
  # value is https://cupdom.fr — the public origin printed on the physical
  # product and encoded into every QR code. It is not a secret and cannot be one.
  #
  # Because it is flagged, Netlify's secrets scanner fails the build whenever that
  # string appears in the repo or build output — which it does, legitimately: it is
  # the default in lib/campaigns/redirectUrl.ts#scanBase() and it appears in the
  # QR golden test. Omitting the KEY (not a path) keeps scanning active for
  # everything else, including QR_DAILY_SECRET and SUPABASE_SERVICE_ROLE_KEY,
  # which genuinely are secrets.
  #
  # Better still: un-tick "Contains secret values" for QR_FALLBACK_URL in the UI.
  # This line makes the build independent of that setting either way.
  SECRETS_SCAN_OMIT_KEYS = "QR_FALLBACK_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers applied to every response — the REAL CSP enforcement.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # NOTE: Next.js injects inline hydration scripts, so 'unsafe-inline' is required for
    # script-src (a strict CSP would need per-request nonces from the framework). jsdelivr
    # is retained only for any CDN-loaded asset; the QR lib is now bundled via npm.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
